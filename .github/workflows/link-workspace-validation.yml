name: Link workspace validation
on:
  push:
    branches: ["codex/professional-link-workspace"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: node --experimental-strip-types --test tests/share-link.test.mjs
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Desktop and mobile interaction checks
        run: |
          npm run start > /tmp/affiliate-preview.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then break; fi
            sleep 1
          done
          node tests/workspace-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: link-workspace-previews
          path: frontend/qa
